<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="898" viewBox="0 0 1200 898" role="img" aria-labelledby="driver-layers-title driver-layers-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="driver-layers-title">Three layers, one of them yours</title>
<desc id="driver-layers-desc">Layer diagram: the application calls the hardware-agnostic sfm::Driver and its commands, which use the CRTP I2C interface, which calls the platform port you write, which drives the I2C bus of the Sensirion SFM4300 or another SF06-family flow meter.</desc>
<defs><marker id="fk-arrow-rail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8893A2"/></marker></defs>
<rect x="0.5" y="0.5" width="1199" height="897" rx="16" fill="#FFFFFF" stroke="#E2E7EE"/>
<text x="32" y="46.8" font-size="16" font-weight="700" letter-spacing="1.2" fill="#3730A3">ARCHITECTURE</text>
<text x="32" y="85.6" font-size="32" font-weight="700" fill="#17202C">Three layers, one of them yours</text>
<text x="32" y="115.4" font-size="18" fill="#566070">The driver and the interface are the same on every MCU. The port is a small class with four required methods.</text>
<rect x="32" y="131.4" width="1136" height="1" fill="#E2E7EE"/>
<rect x="32" y="278.4" width="1136" height="123" rx="16" fill="#EEF0FF" stroke="#C7CBF8" stroke-width="1.2"/>
<path d="M600 242.4 L600 274.4" fill="none" stroke="#8893A2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fk-arrow-rail)"/>
<path d="M600 405.4 L600 437.4" fill="none" stroke="#8893A2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fk-arrow-rail)"/>
<path d="M600 559.4 L600 591.4" fill="none" stroke="#8893A2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fk-arrow-rail)"/>
<path d="M600 710.4 L600 742.4" fill="none" stroke="#8893A2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fk-arrow-rail)"/>
<rect x="32" y="149.4" width="1136" height="89" rx="12" fill="#FFFFFF" stroke="#C9D1DB" stroke-width="1"/>
<rect x="32" y="157.4" width="4" height="73" rx="2" fill="#64748B"/>
<rect x="32" y="441.4" width="1136" height="114" rx="12" fill="#EEF0FF" stroke="#4F46E5" stroke-width="1.4"/>
<rect x="32" y="449.4" width="4" height="98" rx="2" fill="#4F46E5"/>
<rect x="32" y="595.4" width="1136" height="111" rx="12" fill="#E6F6F4" stroke="#0F8B80" stroke-width="1.4"/>
<rect x="32" y="603.4" width="4" height="95" rx="2" fill="#0F8B80"/>
<rect x="32" y="746.4" width="1136" height="89" rx="12" fill="#FFFFFF" stroke="#C9D1DB" stroke-width="1"/>
<rect x="32" y="754.4" width="4" height="73" rx="2" fill="#64748B"/>
<text x="56" y="184.4" font-size="20" font-weight="700" fill="#17202C">Your application</text>
<text x="56" y="215" font-size="17" fill="#2B3442">control loop, gas mixer, ventilator, leak test ...</text>
<rect x="48" y="323.4" width="198.8" height="26" rx="13" fill="#EEF0FF" stroke="#C7CBF8" stroke-width="1"/>
<text x="56" y="341.5" font-size="16" font-weight="700" fill="#3730A3">ReadProductIdentifier</text>
<rect x="254.8" y="323.4" width="189.6" height="26" rx="13" fill="#EEF0FF" stroke="#C7CBF8" stroke-width="1"/>
<text x="262.8" y="341.5" font-size="16" font-weight="700" fill="#3730A3">ReadScaleOffsetUnit</text>
<rect x="452.4" y="323.4" width="152.2" height="26" rx="13" fill="#EEF0FF" stroke="#C7CBF8" stroke-width="1"/>
<text x="460.4" y="341.5" font-size="16" font-weight="700" fill="#3730A3">StartContinuous</text>
<rect x="612.5" y="323.4" width="54.4" height="26" rx="13" fill="#EEF0FF" stroke="#C7CBF8" stroke-width="1"/>
<text x="620.5" y="341.5" font-size="16" font-weight="700" fill="#3730A3">Stop</text>
<rect x="674.9" y="323.4" width="172.9" height="26" rx="13" fill="#EEF0FF" stroke="#C7CBF8" stroke-width="1"/>
<text x="682.9" y="341.5" font-size="16" font-weight="700" fill="#3730A3">ReadMeasurement</text>
<rect x="855.9" y="323.4" width="166" height="26" rx="13" fill="#EEF0FF" stroke="#C7CBF8" stroke-width="1"/>
<text x="863.9" y="341.5" font-size="16" font-weight="700" fill="#3730A3">ReadTemperature</text>
<rect x="48" y="357.4" width="135.6" height="26" rx="13" fill="#EEF0FF" stroke="#C7CBF8" stroke-width="1"/>
<text x="56" y="375.5" font-size="16" font-weight="700" fill="#3730A3">ReadFlowOnly</text>
<rect x="191.6" y="357.4" width="185.4" height="26" rx="13" fill="#EEF0FF" stroke="#C7CBF8" stroke-width="1"/>
<text x="199.6" y="375.5" font-size="16" font-weight="700" fill="#3730A3">ConfigureAveraging</text>
<rect x="385" y="357.4" width="194.8" height="26" rx="13" fill="#EEF0FF" stroke="#C7CBF8" stroke-width="1"/>
<text x="393" y="375.5" font-size="16" font-weight="700" fill="#3730A3">UpdateConcentration</text>
<rect x="587.8" y="357.4" width="106.7" height="26" rx="13" fill="#EEF0FF" stroke="#C7CBF8" stroke-width="1"/>
<text x="595.8" y="375.5" font-size="16" font-weight="700" fill="#3730A3">EnterSleep</text>
<rect x="702.5" y="357.4" width="93.5" height="26" rx="13" fill="#EEF0FF" stroke="#C7CBF8" stroke-width="1"/>
<text x="710.5" y="375.5" font-size="16" font-weight="700" fill="#3730A3">ExitSleep</text>
<rect x="804.1" y="357.4" width="97.5" height="26" rx="13" fill="#EEF0FF" stroke="#C7CBF8" stroke-width="1"/>
<text x="812.1" y="375.5" font-size="16" font-weight="700" fill="#3730A3">SoftReset</text>
<text x="48" y="307.4" font-size="17" font-weight="700" fill="#3730A3">HARDWARE-AGNOSTIC CORE</text>
<text x="326.2" y="307.4" font-size="16" fill="#3730A3">sfm::Driver&lt;I2c&gt;, inc/sfm_driver.hpp</text>
<text x="56" y="476.4" font-size="20" font-weight="700" fill="#3730A3">Communication interface</text>
<text x="56" y="507" font-size="17" fill="#2B3442">sfm::I2cInterface&lt;Self&gt;: CRTP, no virtual calls; framing, CRC-8 checks, part family and</text>
<text x="56" y="531.7" font-size="17" fill="#2B3442">scaling live in the core above, so the interface only moves raw bytes to a 7-bit address</text>
<text x="56" y="630.4" font-size="20" font-weight="700" fill="#115E59">Platform port (your class)</text>
<text x="56" y="659.6" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#2B3442">required:  Write()  Read()  DelayMs()  EnsureInitialized()</text>
<text x="56" y="682.8" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#2B3442">optional:  WriteGeneralCallImpl()</text>
<text x="56" y="781.4" font-size="20" font-weight="700" fill="#17202C">SFM4300 / SF06 flow meter</text>
<text x="56" y="812" font-size="17" fill="#2B3442">I2C up to 1 MHz, address 0x2A-0x2D (ADDR resistor)  /  IRQn active low, optional</text>
<rect x="32" y="847.8" width="14" height="14" rx="4" fill="#EEF0FF" stroke="#4F46E5" stroke-width="1.4"/>
<text x="54" y="862.4" font-size="16" fill="#566070">this library</text>
<rect x="161.8" y="847.8" width="14" height="14" rx="4" fill="#E6F6F4" stroke="#0F8B80" stroke-width="1.4"/>
<text x="183.8" y="862.4" font-size="16" fill="#566070">you write</text>
<rect x="282.1" y="847.8" width="14" height="14" rx="4" fill="#F1F4F8" stroke="#64748B" stroke-width="1.4"/>
<text x="304.1" y="862.4" font-size="16" fill="#566070">hardware</text>
</svg>
